name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  books:
    name: build the ebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      - name: Build EPUB and PDF
        run: tools/build-books.sh "${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: ebooks
          path: |
            dist/learn-rust-with-tests.epub
            dist/learn-rust-with-tests.pdf

  publish:
    name: attach to the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: books
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ebooks
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/learn-rust-with-tests.epub
            dist/learn-rust-with-tests.pdf
          generate_release_notes: true
