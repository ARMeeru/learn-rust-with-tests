name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt, clippy, tests, deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup reads rust-toolchain.toml, so the pinned version and its
      # components are installed without naming them here.
      - name: Install the pinned toolchain
        run: rustup toolchain install && rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146,cargo-deny@0.20.2,just@1.58.0

      - run: just fmt
      - run: just lint
      - run: just test
      - run: just doctest
      - run: just deny
