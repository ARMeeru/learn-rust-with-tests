name: Errata
description: A mistake in the text or the code.
labels: [errata]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: Chapter and section, or a link to the page.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong
      description: Quote the sentence or the code.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
      description: Optional. Small fixes are welcome as pull requests directly.
