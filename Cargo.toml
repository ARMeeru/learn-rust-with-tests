[workspace]
resolver = "3"
# "app/*" is added when Phase 3 creates the first application crate; Cargo rejects
# a glob that matches nothing.
members = ["chapters/*/*"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/ARMeeru/learn-rust-with-tests"

# Every crate in the book takes its dependencies from here, so all step
# crates agree on versions. Each phase adds the crates it introduces; see
# the pinning rule in the planning documents.
[workspace.dependencies]
# Phase 1
criterion = "0.8.2"
rstest = "0.27.0"
thiserror = "2.0.21"
mockall = "0.15.0"
trybuild = "1"
tokio = { version = "1.53.1", features = ["full", "test-util"] }
tokio-util = "0.7.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
wiremock = "0.6.5"
proptest = "1.11.0"
insta = "1.48.0"
tempfile = "3.27.0"
assert_cmd = "2.2.2"
